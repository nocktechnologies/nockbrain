name: Bug report
description: Something in NockBrain doesn't work the way the docs say it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.

        Never paste store files, signing keys, transcripts or private notes into this issue. That includes facts.json, revocations.jsonl, signing-key, signing-key.pub, proposal files and claude-settings.json. Share counts, error messages and sanitized or fictitious examples only, like the ones in examples/notes.md.

        Security problems belong in a private report. See the security policy link on the new issue page.
  - type: input
    id: os
    attributes:
      label: Operating system
      description: Name and version, for example macOS 15.1 or Ubuntu 24.04.
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      description: Output of python3 --version, and the path if it isn't the default python3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: NockBrain version
      description: Contents of the VERSION file at the repository root.
      placeholder: nockbrain 0.1.0
    validations:
      required: true
  - type: dropdown
    id: cryptography
    attributes:
      label: Is the cryptography package installed for that Python?
      description: Check with python3 -c "import cryptography".
      options:
        - "Yes"
        - "No"
        - "Not sure"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command you ran
      description: The exact command, with private paths replaced by placeholders such as $STORE.
      render: shell
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: The output or error message. Remove any memory content, paths or other private details first.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This issue contains no store files, keys, transcripts or private notes, only counts and sanitized examples.
          required: true
